<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeGolf - 프리미엄 스크린골프 조인</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen m-0 font-sans">
    <div id="root" class="w-full max-w-md shadow-2xl bg-slate-50 min-h-screen relative overflow-hidden flex flex-col"></div>

    <script type="text/babel">
        function App() {
            return (
                <div className="min-h-screen pb-28 relative flex flex-col bg-slate-50">
                    {/* 상단 헤더 */}
                    <header className="bg-white/90 backdrop-blur-md px-5 py-3.5 flex items-center justify-between border-b border-slate-100 sticky top-0 z-20 shadow-xs">
                        <div className="flex items-center space-x-2">
                            <span className="bg-emerald-600 text-white text-[11px] font-extrabold px-2 py-1 rounded-md tracking-wider">WE</span>
                            <span className="font-black tracking-wider text-slate-900 text-lg">GOLF</span>
                        </div>
                        <button className="bg-slate-900 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-sm hover:bg-slate-800 transition">
                            앱 다운로드
                        </button>
                    </header>

                    {/* 지역 선택 및 필터 바 */}
                    <div className="bg-white px-5 py-3.5 flex items-center justify-between border-b border-slate-100 shadow-xs">
                        <div className="flex items-center space-x-1.5 text-slate-800 font-semibold">
                            <span className="text-emerald-600">📍</span>
                            <select className="bg-transparent font-bold text-slate-900 outline-none cursor-pointer">
                                <option>강남구</option>
                                <option>판교</option>
                                <option>분당구</option>
                            </select>
                        </div>
                        <span className="text-[11px] bg-emerald-50 text-emerald-700 font-bold px-2.5 py-1 rounded-full border border-emerald-100">
                            ⚡ 실시간 번개 핫플
                        </span>
                    </div>

                    {/* 홍보 배너 */}
                    <div className="p-5">
                        <div className="bg-gradient-to-br from-slate-900 via-indigo-950 to-emerald-950 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
                            <div className="absolute -right-4 -bottom-4 w-24 h-24 bg-emerald-500/10 rounded-full blur-xl"></div>
                            <h2 className="font-extrabold text-base mb-1.5 tracking-tight">필드 가기 전, 가볍게 스크린 한판! ⛳</h2>
                            <p className="text-xs text-slate-300 leading-relaxed">내 근처 골퍼들과 실시간으로 조인하고 즐겁게 라운드하세요.</p>
                        </div>
                    </div>

                    {/* 실시간 번개 리스트 섹션 */}
                    <div className="px-5 space-y-3.5 flex-1">
                        <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">오늘의 추천 조인</div>
                        
                        {/* 카드 1 */}
                        <div className="bg-white p-4.5 rounded-2xl shadow-xs border border-slate-100 hover:shadow-md transition">
                            <div className="flex justify-between items-start mb-2.5">
                                <div className="space-x-1.5">
                                    <span className="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-md font-bold">🍻 치맥/뒤풀이</span>
                                    <span className="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md font-bold">💸 핸디 내기</span>
                                </div>
                                <span className="text-xs font-semibold text-rose-500">오늘 20:00</span>
                            </div>
                            <h3 className="font-bold text-slate-900 text-sm mb-1">역삼동 스크린골프 조인하실 분!</h3>
                            <p className="text-xs text-slate-500 mb-4 flex items-center space-x-1">
                                <span>📍</span><span>강남 골프존 파크 역삼점</span>
                            </p>
                            
                            <div className="flex justify-between items-center pt-3 border-t border-slate-100">
                                <div className="text-xs text-slate-600">현재 참여: <strong className="text-slate-900 font-bold">남 2 / 여 1</strong></div>
                                <button className="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-sm hover:bg-emerald-500 transition">
                                    참여 신청
                                </button>
                            </div>
                        </div>

                        {/* 카드 2 */}
                        <div className="bg-white p-4.5 rounded-2xl shadow-xs border border-slate-100 hover:shadow-md transition">
                            <div className="flex justify-between items-start mb-2.5">
                                <div className="space-x-1.5">
                                    <span className="text-[10px] bg-amber-50 text-amber-700 px-2 py-0.5 rounded-md font-bold">☕ 커피 내기</span>
                                </div>
                                <span className="text-xs font-semibold text-slate-400">내일 14:30</span>
                            </div>
                            <h3 className="font-bold text-slate-900 text-sm mb-1">판교 직장인 주말 스크린 모임</h3>
                            <p className="text-xs text-slate-500 mb-4 flex items-center space-x-1">
                                <span>📍</span><span>판교 프렌즈스크린</span>
                            </p>
                            
                            <div className="flex justify-between items-center pt-3 border-t border-slate-100">
                                <div className="text-xs text-slate-600">현재 참여: <strong className="text-slate-900 font-bold">남 1 / 여 2</strong></div>
                                <button className="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-sm hover:bg-emerald-500 transition">
                                    참여 신청
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 하단 고정 CTA */}
                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-white/90 backdrop-blur-md border-t border-slate-100 shadow-xl">
                        <button className="w-full bg-slate-900 text-white font-bold py-3.5 rounded-2xl shadow-md text-sm hover:bg-slate-800 transition flex items-center justify-center space-x-1.5">
                            <span>⚡ 앱으로 3초 만에 번개 개설하기</span>
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
